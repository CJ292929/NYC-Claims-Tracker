name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: nyc-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: CI validate + Deploy to Vercel Production
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test (local-safe, excludes Supabase integration test)
        run: npx vitest run --exclude "**/claims.integration.test.ts"

      - name: Build
        run: pnpm build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts via Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel Production
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed to: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Health check production deployment
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          INPUT="%7B%22json%22%3A%7B%22timestamp%22%3A$(date +%s000)%7D%7D"
          HEALTH_URL="$URL/api/trpc/system.health?input=$INPUT"
          echo "Checking $HEALTH_URL"
          for attempt in 1 2 3 4 5; do
            if response=$(curl -sf --max-time 15 "$HEALTH_URL") && echo "$response" | grep -q '"ok":true'; then
              echo "Health check passed on attempt $attempt: $response"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1
